name: RDP

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Ollama model to download'
        required: false
        default: 'hf.co/mradermacher/Qwen2.5-Coder-7B-Instruct-abliterated-GGUF:Q4_K_M'
        type: string
      session_timeout_minutes:
        description: 'Session timeout in minutes (5-360)'
        required: false
        default: '360'
        type: string

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          
          # Allow incoming connection on port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          
          # Allow Ollama port 11434
          netsh advfirewall firewall delete rule name="Ollama-API" 2>$null
          netsh advfirewall firewall add rule name="Ollama-API" `
            dir=in action=allow protocol=TCP localport=11434

          # Restart the Remote Desktop service to ensure changes take effect
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          $charSet = @{
              Upper   = [char[]](65..90)      # A-Z
              Lower   = [char[]](97..122)     # a-z
              Number  = [char[]](48..57)      # 0-9
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126)) # Special characters
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          # Check if user already exists
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name "RDP" -Password $securePass
          } else {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member "RDP"
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          }
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          try {
              Write-Host "Downloading Tailscale..."
              Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -ErrorAction Stop
              
              Write-Host "Installing Tailscale..."
              Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait -ErrorAction Stop
              
              Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
              Write-Host "Tailscale installed successfully"
          } catch {
              Write-Error "Tailscale installation failed: $_"
              exit 1
          }

      - name: Install Ollama
        run: |
          try {
              Write-Host "Installing Ollama..."
              irm https://ollama.com/install.ps1 | iex
              
              # Wait for Ollama installation to complete
              Start-Sleep -Seconds 15
              
              # Search for ollama executable in common locations
              $possiblePaths = @(
                  "$env:ProgramFiles\Ollama\ollama.exe",
                  "$env:LOCALAPPDATA\Programs\Ollama\ollama.exe",
                  "$env:USERPROFILE\AppData\Local\Programs\Ollama\ollama.exe",
                  "$env:USERPROFILE\.ollama\ollama.exe"
              )
              
              $ollamaExePath = $null
              foreach ($path in $possiblePaths) {
                  if (Test-Path $path) {
                      $ollamaExePath = $path
                      Write-Host "Found Ollama at: $ollamaExePath"
                      break
                  }
              }
              
              if (-not $ollamaExePath) {
                  # Search entire Program Files and AppData
                  Write-Host "Searching for Ollama installation..."
                  $found = @()
                  $found += Get-ChildItem -Path "$env:ProgramFiles" -Name "ollama.exe" -Recurse -ErrorAction SilentlyContinue 2>/dev/null
                  $found += Get-ChildItem -Path "$env:LOCALAPPDATA" -Name "ollama.exe" -Recurse -ErrorAction SilentlyContinue 2>/dev/null
                  
                  if ($found.Count -gt 0) {
                      $ollamaExePath = $found[0].FullName
                      Write-Host "Found Ollama at: $ollamaExePath"
                  }
              }
              
              if ($ollamaExePath) {
                  echo "OLLAMA_EXE=$ollamaExePath" >> $env:GITHUB_ENV
                  Write-Host "Ollama installed successfully at: $ollamaExePath"
              } else {
                  Write-Error "Could not find Ollama executable after installation"
                  exit 1
              }
          } catch {
              Write-Error "Ollama installation failed: $_"
              exit 1
          }

      - name: Establish Tailscale Connection
        run: |
          try {
              Write-Host "Connecting to Tailscale..."
              & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
              
              $tsIP = $null
              $retries = 0
              while (-not $tsIP -and $retries -lt 10) {
                  $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
                  if ($tsIP) { $tsIP = $tsIP.Trim() }
                  if (-not $tsIP) {
                      Start-Sleep -Seconds 5
                      $retries++
                  }
              }
              
              if (-not $tsIP) {
                  Write-Error "Tailscale IP not assigned after 50 seconds"
                  exit 1
              }
              echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
              Write-Host "Tailscale connected with IP: $tsIP"
          } catch {
              Write-Error "Tailscale connection failed: $_"
              exit 1
          }

      - name: Start Ollama Server on Tailscale IP
        run: |
          try {
              Write-Host "Starting Ollama server..."
              
              $ollamaExe = "$env:OLLAMA_EXE"
              if (-not $ollamaExe) {
                  Write-Error "Ollama executable path not set"
                  exit 1
              }
              
              # Set environment variable for Ollama to bind to all interfaces
              $env:OLLAMA_HOST = "0.0.0.0:11434"
              
              # Start Ollama process
              Write-Host "Launching: $ollamaExe serve"
              Start-Process -FilePath $ollamaExe -ArgumentList "serve" -WindowStyle Hidden -NoNewWindow
              
              # Wait for server to start
              Start-Sleep -Seconds 10
              
              # Check if process is running
              $process = Get-Process ollama -ErrorAction SilentlyContinue
              if ($process) {
                  Write-Host "Ollama server started successfully (PID: $($process.Id))"
              } else {
                  Write-Host "Ollama process started but may still be initializing..."
              }
              
              echo "OLLAMA_URL=http://$env:TAILSCALE_IP:11434" >> $env:GITHUB_ENV
          } catch {
              Write-Error "Ollama server startup failed: $_"
              exit 1
          }

      - name: Download Ollama Model
        run: |
          try {
              $ollamaExe = "$env:OLLAMA_EXE"
              if (-not $ollamaExe) {
                  Write-Error "Ollama executable path not set"
                  exit 1
              }
              
              $env:OLLAMA_HOST = "0.0.0.0:11434"
              
              $model = "${{ github.event.inputs.model }}"
              if ([string]::IsNullOrWhiteSpace($model)) {
                  $model = "hf.co/mradermacher/Qwen2.5-Coder-7B-Instruct-abliterated-GGUF:Q4_K_M"
              }
              
              Write-Host "Downloading Ollama model: $model (this may take several minutes)..."
              Write-Host "Using executable: $ollamaExe"
              
              # Call ollama pull with full path
              & $ollamaExe pull $model
              
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Model pull failed with exit code $LASTEXITCODE"
                  exit 1
              }
              
              Write-Host "Model download completed. Available models:"
              & $ollamaExe list
          } catch {
              Write-Error "Model download failed: $_"
              exit 1
          }
      
      - name: Verify RDP Accessibility
        run: |
          try {
              Write-Host "Verifying RDP accessibility on $env:TAILSCALE_IP:3389..."
              $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
              if (-not $testResult.TcpTestSucceeded) {
                  Write-Error "TCP connection to RDP port 3389 failed"
                  exit 1
              }
              Write-Host "RDP accessibility verified!"
          } catch {
              Write-Error "RDP verification failed: $_"
              exit 1
          }

      - name: Verify Ollama API Accessibility
        run: |
          try {
              Write-Host "Verifying Ollama API on $env:OLLAMA_URL..."
              $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 11434 -WarningAction SilentlyContinue
              if (-not $testResult.TcpTestSucceeded) {
                  Write-Error "TCP connection to Ollama port 11434 failed"
                  exit 1
              }
              Write-Host "Ollama API accessibility verified!"
          } catch {
              Write-Error "Ollama API verification failed: $_"
              exit 1
          }

      - name: Maintain Connection
        run: |
          $sessionTimeout = [int]"${{ github.event.inputs.session_timeout_minutes }}"
          if ($sessionTimeout -lt 5 -or $sessionTimeout -gt 360) {
              $sessionTimeout = 360
          }
          
          $endTime = (Get-Date).AddMinutes($sessionTimeout)
          
          Write-Host "`n========== RDP & OLLAMA ACCESS =========="
          Write-Host "RDP Address:      $env:TAILSCALE_IP"
          Write-Host "RDP Username:     RDP"
          Write-Host "RDP Password:     $env:RDP_PASS"
          Write-Host "Ollama API:       $env:OLLAMA_URL"
          Write-Host "Session End:      $endTime"
          Write-Host "========================================`n"
          
          while ((Get-Date) -lt $endTime) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Active - Session ends at $($endTime.ToString('HH:mm:ss'))"
              Start-Sleep -Seconds 300
          }
          
          Write-Host "Session timeout reached. Disconnecting..."

      - name: Cleanup on Exit
        if: always()
        run: |
          Write-Host "Cleaning up resources..."
          
          # Stop Ollama
          try {
              Stop-Process -Name ollama -Force -ErrorAction SilentlyContinue
              Write-Host "Ollama stopped"
          } catch {
              Write-Host "Ollama cleanup failed"
          }
          
          # Disconnect Tailscale
          try {
              & "$env:ProgramFiles\Tailscale\tailscale.exe" logout 2>$null
              Write-Host "Tailscale disconnected"
          } catch {
              Write-Host "Tailscale logout failed or already disconnected"
          }
          
          # Remove RDP user
          try {
              Remove-LocalUser -Name "RDP" -Confirm:$false -ErrorAction SilentlyContinue
              Write-Host "RDP user removed"
          } catch {
              Write-Host "RDP user removal failed"
          }
          
          # Remove firewall rules
          try {
              netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
              netsh advfirewall firewall delete rule name="Ollama-API" 2>$null
              Write-Host "Firewall rules removed"
          } catch {
              Write-Host "Firewall rule removal failed"
          }
